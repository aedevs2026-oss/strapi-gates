services:
  - type: web
    name: gates-admin
    runtime: node
    rootDir: strapi-gates
    buildCommand: npm ci && NODE_OPTIONS="--max-old-space-size=2048" npm run build:render
    startCommand: npm run start
    healthCheckPath: /_health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
