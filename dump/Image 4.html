<script>
        // OTP Auto-focus Logic
        const inputs = document.querySelectorAll('.otp-input');
        inputs.forEach((input, index) => {
            input.addEventListener('keyup', (e) => {
                if (e.key >= 0 && e.key <= 9) {
                    if (index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                } else if (e.key === 'Backspace') {
                    if (index > 0) {
                        inputs[index - 1].focus();
                    }
                }
            });
        });

        // Timer Logic
        let seconds = 45;
        const timerSpan = document.getElementById('time');
        const resendBtn = document.getElementById('resend-btn');
        const timerDisplay = document.getElementById('timer-display');

        const countdown = setInterval(() => {
            seconds--;
            let displaySecs = seconds < 10 ? `0${seconds}` : seconds;
            timerSpan.textContent = `00:${displaySecs}`;

            if (seconds <= 0) {
                clearInterval(countdown);
                timerDisplay.classList.add('hidden');
                resendBtn.disabled = false;
                resendBtn.classList.remove('opacity-50', 'text-outline', 'cursor-not-allowed');
                resendBtn.classList.add('text-primary', 'font-bold', 'hover:text-primary-container');
            }
        }, 1000);

        // Interaction Feedback
        resendBtn.addEventListener('click', () => {
            if(!resendBtn.disabled) {
                alert('A new OTP has been sent to your registered mobile number.');
                // Reset timer logic would go here in a real app
            }
        });
    </script>
